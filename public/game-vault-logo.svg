<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e101c"/>
      <stop offset="50%" stop-color="#080911"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>

    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Canvas Background -->
  <rect width="800" height="240" rx="24" fill="url(#bgGrad)"/>
  <rect width="800" height="240" rx="24" fill="none" stroke="#312e81" stroke-width="2" opacity="0.6"/>

  <!-- Left: Vault Emblem (Center x: 120, y: 120) -->
  <g transform="translate(120, 120) scale(0.38)">
    <g transform="translate(-256, -256)">
      <!-- Outer Rounded Hexagonal Vault Shield -->
      <rect x="24" y="24" width="464" height="464" rx="100" fill="#0b0d18"/>
      <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#shieldBorder)" stroke-width="14" filter="url(#neonGlow)"/>

      <!-- Rivets -->
      <circle cx="88" cy="88" r="12" fill="#06b6d4"/>
      <circle cx="424" cy="88" r="12" fill="#a855f7"/>
      <circle cx="88" cy="424" r="12" fill="#a855f7"/>
      <circle cx="424" cy="424" r="12" fill="#06b6d4"/>

      <!-- Tracks -->
      <circle cx="256" cy="256" r="180" fill="none" stroke="#312e81" stroke-width="4" stroke-dasharray="16 10"/>
      <circle cx="256" cy="256" r="145" fill="none" stroke="#1e293b" stroke-width="3"/>

      <!-- Gear base -->
      <circle cx="256" cy="256" r="128" fill="url(#gearGrad)" stroke="#6b21a8" stroke-width="8"/>

      <!-- Gear Teeth -->
      <rect x="240" y="104" width="32" height="32" rx="6" fill="url(#purpleAccent)"/>
      <rect x="240" y="376" width="32" height="32" rx="6" fill="url(#purpleAccent)"/>
      <rect x="104" y="240" width="32" height="32" rx="6" fill="url(#purpleAccent)"/>
      <rect x="376" y="240" width="32" height="32" rx="6" fill="url(#purpleAccent)"/>
      
      <g transform="rotate(45 256 256)">
        <rect x="244" y="108" width="24" height="28" rx="6" fill="url(#cyanAccent)"/>
        <rect x="244" y="376" width="24" height="28" rx="6" fill="url(#cyanAccent)"/>
        <rect x="108" y="244" width="28" height="24" rx="6" fill="url(#cyanAccent)"/>
        <rect x="376" y="244" width="28" height="24" rx="6" fill="url(#cyanAccent)"/>
      </g>

      <!-- Mid Gear Ring -->
      <circle cx="256" cy="256" r="92" fill="#090a12" stroke="#a855f7" stroke-width="6"/>

      <!-- Crosshairs -->
      <line x1="256" y1="168" x2="256" y2="344" stroke="#c084fc" stroke-width="12" stroke-linecap="round"/>
      <line x1="168" y1="256" x2="344" y2="256" stroke="#c084fc" stroke-width="12" stroke-linecap="round"/>

      <!-- Pins -->
      <circle cx="256" cy="190" r="10" fill="#22d3ee"/>
      <circle cx="256" cy="322" r="10" fill="#22d3ee"/>
      <circle cx="190" cy="256" r="10" fill="#22d3ee"/>
      <circle cx="322" cy="256" r="10" fill="#22d3ee"/>

      <!-- Central Core -->
      <circle cx="256" cy="256" r="44" fill="url(#gearGrad)" stroke="#06b6d4" stroke-width="8"/>
      <polygon points="256,224 284,256 256,288 228,256" fill="url(#cyanAccent)"/>
      <circle cx="256" cy="256" r="8" fill="#ffffff"/>
    </g>
  </g>

  <!-- Right: Typography -->
  <text x="230" y="112" font-family="'Rajdhani', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="64" letter-spacing="4" fill="#ffffff">
    GAME VAULT
  </text>
  <text x="592" y="112" font-family="'Rajdhani', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="64" letter-spacing="4" fill="url(#textGrad)">
    FORUM
  </text>

  <!-- Cyber Divider Bar -->
  <line x1="230" y1="134" x2="740" y2="134" stroke="#312e81" stroke-width="2"/>
  <rect x="230" y="132" width="60" height="4" fill="#06b6d4" rx="2"/>

  <!-- Tagline -->
  <text x="232" y="166" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="16" letter-spacing="6" fill="#94a3b8">
    WATCH • PLAY • DISCUSS • DISCOVER
  </text>
</svg>
