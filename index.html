    <!-- Structured Data (JSON-LD) for Search Consoles & Rich Snippets -->
    <script type="application/ld+json">

      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.gamevault.forum/#website",

          "publisher": {
            "@id": "https://www.gamevault.forum/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.gamevault.forum/?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://www.gamevault.forum/#organization",
          "name": "Game Vault Forum",
          "url": "https://www.gamevault.forum/",

            "height": 512,
            "caption": "Game Vault Forum Logo"
          },
          "founder": {
            "@type": "Person",

          },

            "https://www.youtube.com/@GameVaultForum",
            "https://youtube.com/@GameVaultForum",
            "https://discord.com",
            "https://x.com"
          ]
        },

            "https://www.gamevault.forum/",
            "https://www.gamevault.forum/videos",
            "https://www.gamevault.forum/articles",
            "https://www.gamevault.forum/reviews",

            "https://www.gamevault.forum/about"

        }
